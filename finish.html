<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/reset.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/finish.css">
    <title>終了画面</title>
</head>
<body>
    <main class="finish_container">

        <!-- データ保存中に表示 -->
        <div id="saving_message">
            <div class="loading_spinner"></div>
            <h1>実験データを保存しています...</h1>
            <p>画面を閉じずにお待ちください。</p>
        </div>

        <!-- 保存成功後に表示 -->
        <div id="finish_message" style="display: none;">
            <h1>実験は以上で終了です。</h1>

            <p>
                今回ご回答いただいた内容や閲覧データは、<br>
                本研究のために大切に活用させていただきます。
            </p>

            <p>
                最後までご協力いただき、本当にありがとうございました。
            </p>
        </div>

        <!-- 保存失敗時に表示 -->
        <div id="error_message" style="display: none;">
            <h1>データの保存に失敗しました。</h1>

            <p>
                通信環境をご確認のうえ、<br>
                もう一度お試しください。
            </p>

            <button id="retry_button">
                再試行
            </button>
        </div>

    </main>

    <script src="js/log.js"></script>
    <script type="module" src="js/finish.js"></script>
</body>
</html>
